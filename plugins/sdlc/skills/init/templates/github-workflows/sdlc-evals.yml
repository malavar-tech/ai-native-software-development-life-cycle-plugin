# Stage 4 — Continuous evals in CI. Runs nightly and whenever the agent configuration
# (CLAUDE.md, .claude/**) or the eval suite changes. A config change that drops the pass
# rate below the threshold fails this check and gets reviewed before it merges.
name: sdlc-evals
on:
  pull_request:
    paths: ['CLAUDE.md', '.claude/**', 'evals/**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # {{SETUP_STEPS}}
      - run: npm install -g @anthropic-ai/claude-code
      # Optional: also evaluate the sdlc plugin's hooks and skills in CI.
      # - run: |
      #     claude plugin marketplace add {{MARKETPLACE_REPO}}
      #     claude plugin install sdlc@ai-native-sdlc
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_PASS_THRESHOLD: '0.8'
        run: ./evals/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
